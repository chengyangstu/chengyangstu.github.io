name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check archival guarantees
        run: python scripts/check.py
      - name: Check textbook links and chapters
        run: python scripts/check_tutorial.py
      - name: Check math, reading data and index examples
        run: node scripts/check_reader.cjs
      - name: Recompute investment teaching examples
        run: |
          python investing/labs/quant_lab.py
          python investing/labs/yanhu_model.py
      - name: Stage public files only
        run: |
          mkdir _site
          cp index.html style.css math.js favicon.svg _site/
          cp -r plasma cuda investing vendor _site/
          python - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['GITHUB_SHA'][:12]
          assets = re.compile(r'((?:href|src)=")((?!https?://)[^"?#]+\.(?:css|js))(?:\?[^"#]*)?"')
          for page in Path('_site').rglob('*.html'):
              html = page.read_text(encoding='utf-8')
              page.write_text(assets.sub(lambda m: f'{m[1]}{m[2]}?v={version}"', html), encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
